<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory</title>


    <style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body, html {
    width: 100%;
    overflow-x: hidden ;
}


.btn { 
    background-color: #d69b3f;
    border: none;
    padding: 5px 10px;
    color: #ffffff;
    border-radius: 5px;
    cursor: pointer;
}

.btn:hover {
    background-color: #9a6105;
}

caption {
    color:#174457;
    text-align: center;
    font-weight: 600;
    margin-bottom: 3%;
    margin-top: 70px;
    font-size: 40px;
    font-family: 'Roboto', sans-serif;
 }

table {
    width: 80%;
    margin: 100px auto 0 auto;
    background-color: #e5f1f1;
    border: 0.5px solid #174457;
    border-radius: 1px;
    box-shadow: 1px 1px 3px rgb(24, 68, 87, 0.7);
    color: #174457;
    font-family: 'Roboto', sans-serif;
    text-align: center;
    
    
}



 #logo-bar {
    background-color: #174457;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 150px;
    padding: 0 20px;
 }

 #logo a {
    display: inline-block;
 }


 #logo{
    position: relative;
    background-color:   #174457;
    height: 150px;
    width: 100px;
}


 #logo img {
    display: block;
    height: 100px;
    width: 170px;
    cursor: pointer;
 }

 #login-view {
    position:absolute;
    top: 65px;
    right: 20px;
    color: white;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Roboto', sans-serif;
 }

 #login-view label {
    color: #ffffff;
    font-weight: bold;
 }

 #login-view input {
   padding: 5px 8px;
   border-radius: 5px;
   border: none;
 }
 
#banner {
    position: relative;
    width: 100%;
    overflow: hidden;

}
 
#banner img {
    width: 100%;
    height: 600px;
    display: block;
    object-fit: cover;
    filter: blur(3px);
}

#banner h1 {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background-color: rgb(254, 254, 254, 0.7); 
    color: rgb(24, 68, 87, 0.7);
    text-shadow:  0px 0px 10px rgb(24, 68, 87, 0.7);
    font-size: 40px;
    font-family: 'Roboto', sans-serif;
    font-weight: 600;
    border-radius: 10px;
    text-align: center;
    padding: 12% 40% ;
    white-space: nowrap;


}

#add-product-container{
    margin-top: 10px;
    text-align: center;
}

#add-product-btn {
    background-color: #d69b3f;
    color: #ffffff;
    cursor: pointer;
}

footer{
    background-color: #174457;
    text-align: center;
    font-family: 'Roboto', sans-serif;
    font-size: 15px;
    width: 100%;
    padding: 10px 0;
    position: relative;
    margin-top: 1000px;
    
  
}

footer .informations {
    display: flex;
    gap: 50px;
    justify-content: center;
  
  
}


footer a {
    color: #e5f1f1;
    position: relative;
   
  
}

footer a:hover {
    color: #d69b3f;
}

    </style>


</head>


<body>

<header>
<div id="logo-bar">
  <div id="logo">
<a href="inventory_manager.htm">
 <img src="logo.jpg" alt="logo" height="150" width="300"> </a>
  </div> 

  <form id ="login-view">
    <label for="admin">Login</label>
     <input type="text" id="admin" name="username" placeholder="Enter your username"  minlength="5"  maxlength="30" required>

     <label for="password">Password</label>
     <input type="password" id="password" name="password" placeholder="Enter your password"  minlength="8" maxlength="15" required>
    
    
     <button class="btn" type="submit">Login</button>
     <button class="btn" type="button">Logout</button> 
     
    </form>
    </div>

</header>
 
 <div id="banner">
    <img src="magazziono.jpg"  alt="banner" width="" height="">
  

  
    <h1> Welcome to Inventory Hub</h1>
 </div>

<table id="products-table"> 
<caption>Product overview</caption>

<thead>
    <tr>  
     <th>ID</th>
     <th>NAME</th>
     <th>DESCRIPTION</th>
     <th>PRICE</th>
     <th>STOCK</th>
    </tr>
</thead>

<tbody></tbody>


 <tfoot></tfoot>
</table>

<div id ="add-product-container">
    <input type="number" id="new-id" placeholder="ID">
    <input type="text" id="new-name" placeholder="Product Name">
    <input type="text" id="new-description" placeholder="Description">
    <input type="number" id="new-price" placeholder="Price" step="0.01">
    <input type="number" id="new-stock" placeholder="Stock">
    <button id ="add-product-btn" class="btn">Add Product</button>


 
 </th>

  

 <footer>
    <div class="informations">
        <a href="#Contacts">Contacts</a>
        <a href="#About us">About us</a>
        <a href="°News">News</a>
    </div>
 </footer>
    
 
 
 
 <script>

let isLoggedIn = JSON.parse(localStorage.getItem("isLoggedIn")) || false;

let products = JSON.parse(localStorage.getItem("products")) || [
    { id: 1, name: "Box", description: "38*40", price: 2.0, stock: 20}
 ];

window.onload = function() {
    toggleView(isLoggedIn);
    renderProducts();
};


document.querySelector('#login-view').addEventListener('submit', function(e){
e.preventDefault();
const username = document.querySelector('#admin').value;
const password = document.querySelector('#password').value;

 if (username === 'admin' && password === 'password'){
    localStorage.setItem('isLoggedIn', JSON.stringify(true));
    isLoggedIn = true;
    toggleView(true);
} else {
    alert('Invalid credentials');
}
});


document.querySelector('button[type="button"]').addEventListener('click', function() {
    localStorage.removeItem('isLoggedIn');
    isLoggedIn = false;
    toggleView(false);
})

function toggleView(isLoggedIn) {
    document.querySelector('#products-table').style.display = isLoggedIn ? 'table': 'none';
    document.querySelector('#banner').style.display = isLoggedIn ? 'none' : 'block';
    document.querySelector('#add-product-container').style.display = isLoggedIn ? 'block': 'none';
    document.querySelector('button[type="submit"]').style.display = isLoggedIn ? 'none' : 'inline-block';
    document.querySelector('button[type = "button"]').style.display = isLoggedIn ? 'inline-block' : 'none';
}



function saveProducts() {
    localStorage.setItem("products", JSON.stringify(products));
}




function renderProducts() {
    const tbody = document.querySelector('#products-table tbody');
    tbody.innerHTML = '';
    products.forEach(p => {
        const row = document.createElement('tr');
        row.innerHTML = `
        <td>${p.id}</td>
        <td>${p.name}</td>
        <td>${p.description}</td>
        <td>${p.price}</td>
        <td>${p.stock}</td>
        <td><button class="btn" onclick="handleEditProduct(${p.id})">Edit</button>
        <button class="btn" onclick="handleDeleteProduct(${p.id})">Delete</button></td>`;
        ;
        tbody.appendChild(row);
})
}

function handleEditProduct(id) {
    const product = products.find(p => p.id === id);
    if (!product) return;

    editingProductId = id;

document.querySelector('#new-id').value = product.id;
    document.querySelector('#new-name').value =product.name;
    document.querySelector('#new-description').value = product.description;
    document.querySelector('#new-price').value = product.price;
    document.querySelector('#new-stock').value = product.stock;

    document.querySelector('#add-product-btn').textContent = "Save Product"

}

function handleDeleteProduct(id) {
    products = products.filter(p => p.id !==id);
    saveProducts();
    renderProducts();
}


let editingProductId = null;


function handleSaveProduct() {
    const id = editingProductId || Date.now();
    const name = document.querySelector('#new-name').value;
    const description = document.querySelector('#new-description').value;
    const price = parseFloat(document.querySelector('#new-price').value);
    const stock = parseInt(document.querySelector('#new-stock').value);

    if (name && description && !isNaN(price) && !isNaN(stock)) {
        if (editingProductId) {
            const product = products.find(p => p.id === editingProductId);
            product.name = name;
            product.description = description;
            product.price = price;
            product.stock = stock;
        } else {
            products.push({ id, name, description, price, stock });
        }
    

    saveProducts();
    renderProducts();
    editingProductId = null;

    document.querySelector('#new-id').value = '';
    document.querySelector('#new-name').value = '';
    document.querySelector('#new-description').value = '';
    document.querySelector('#new-price').value = '';
    document.querySelector('#new-stock').value = '';


} else {
    alert("Please fill all fields correctly.");
}

}


document.querySelector('#add-product-btn').addEventListener('click', handleSaveProduct);


 </script>
 



</body>
</html>
